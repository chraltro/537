<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* The theme, before the first pixel. This used to be corrected inside
   `initChrome`, which runs after a module load and after that module's
   top-level await on the manifest -- so a reader on the light theme got about a
   tenth of a second of the dark page first. Five lines in the head, run at parse
   time, and the flash is gone.

   It also settles what the default is. The site shipped `data-theme="dark"` on
   every page and consulted `prefers-color-scheme` nowhere, so somebody whose
   whole machine is set to light had to ask this one site again on every device.
   A saved choice still wins over the system; the system wins over us. */
(function () {
  try {
    var t = localStorage.getItem('plf-theme');
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private mode: the markup's own default stands */ }
})();
</script>
<title>Forecast widget</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://chraltro.github.io/537/embed.html">
<link rel="modulepreload" href="assets/app.js">
<link rel="preload" as="fetch" crossorigin href="data/leagues.json">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:,">
<style>
  /* Standalone on purpose: no masthead, no footer, no navigation. An embed
     that carries a whole site's chrome into somebody else's page is a banner,
     not a widget. */
  html, body { background: transparent; }
  body { margin: 0; padding: 0; }
  .emb {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px 14px; font-family: var(--sans); color: var(--ink);
    max-width: 460px; margin: 0 auto;
  }
  .emb h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -0.02em; }
  .emb .sub { color: var(--muted); font-size: 11.5px; margin: 0 0 12px; }
  .emb .r {
    display: grid; grid-template-columns: 16px 8px 1fr 46px; gap: 8px;
    align-items: center; padding: 5px 0; font-size: 13px;
  }
  .emb .r + .r { border-top: 1px solid var(--grid); }
  .emb .r .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .emb .r .c { height: 15px; border-radius: 2px; }
  .emb .r .p { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
  .emb footer {
    margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--grid);
    display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px;
  }
  .emb a { color: var(--muted); }
  .emb a:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="emb" id="emb"><p class="sub">Loading…</p></div>

<script type="module">
/* The whole point of an embed is that it is small and does not phone home for
   anything it does not need, so this page imports only the formatting helpers
   and reads the manifest and one forecast file directly. */
import { esc, pct, chipColor, fmtDate } from './assets/app.js';

const ROOT = new URL('.', location.href).pathname;
const q = new URLSearchParams(location.search);
const slug = (q.get('lg') || 'premier-league').replace(/[^a-z0-9-]/g, '');
const rows = Math.min(Math.max(parseInt(q.get('n') || '6', 10) || 6, 3), 12);
const metric = ['title', 'ucl', 'releg'].includes(q.get('m')) ? q.get('m') : 'title';
if (q.get('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

const el = document.getElementById('emb');

function fail(msg) {
  el.innerHTML = `<h1>Forecast unavailable</h1><p class="sub">${esc(msg)}</p>
    <footer><span><a href="${ROOT}index.html" target="_blank" rel="noopener">chraltro.github.io/537</a></span></footer>`;
}

try {
  const man = await (await fetch(`${ROOT}data/leagues.json`, { cache: 'no-cache' })).json();
  const entry = (man.leagues || []).find((l) => l.slug === slug);
  if (!entry || !entry.ready) throw new Error(`no live forecast for ${slug}`);

  const fc = await (await fetch(`${ROOT}data/${slug}/forecast.json`, { cache: 'no-cache' })).json();
  const label = { title: entry.kind === 'cup' ? 'Trophy' : 'Title',
                  ucl: entry.kind === 'promotion' ? 'Up' : `Top ${entry.ucl_places}`,
                  releg: entry.kind === 'cup' ? 'Out' : 'Down' }[metric];
  const list = [...fc.teams].sort((a, b) => (b[metric] || 0) - (a[metric] || 0)).slice(0, rows);
  const link = `${ROOT}index.html${slug === man.default ? '' : `?lg=${encodeURIComponent(slug)}`}`;

  el.innerHTML = `
    <h1>${esc(entry.name)} ${esc(fc.season)}</h1>
    <p class="sub">${esc(label)} · ${fc.matches_played} of ${fc.matches_total} played ·
      ${fc.n_sims.toLocaleString()} simulated seasons</p>
    ${list.map((t, i) => `
      <div class="r">
        <span class="n">${i + 1}</span>
        <span class="c" style="background:${chipColor(t.primary)}"></span>
        <span>${esc(t.name)}</span>
        <span class="p">${pct(t[metric] || 0)}</span>
      </div>`).join('')}
    <footer>
      <span><a href="${link}" target="_blank" rel="noopener">chraltro.github.io/537</a></span>
      <span>${esc(fmtDate(fc.generated, { year: true }))}</span>
    </footer>`;
} catch (e) {
  fail(e.message);
}
</script>
</body>
</html>
