name: Rebuild forecast

on:
  push:
    branches: [claude/premier-league-predictions-rv9405, main]
  workflow_dispatch:
  schedule:
    # Every six hours. The upstream result mirror refreshes daily, so this keeps
    # the site current the morning after a matchday without hammering anything.
    - cron: '17 */6 * * *'

permissions:
  # write: scheduled builds commit the forecast's state files (frozen pre-match
  # predictions, daily history snapshots) back to main -- without that, the
  # honest in-season scorecard loses its receipts between builds.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pillow draws the share cards (model/social.py); DejaVu, the font
        # they use, ships with ubuntu-latest. A missing Pillow is survivable --
        # the build prints a line and skips the cards -- but not desirable.
        run: pip install numpy scipy pytest Pillow

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Probe the second feeds
        # The one check that cannot run where this code is written. The dev
        # sandbox reaches raw.githubusercontent.com and nothing else, so the
        # readers for football-data.co.uk and Wikipedia ship unfetched; here
        # they are fetched, parsed and lined up against a season the GitHub feed
        # already gave us. `continue-on-error` because a second feed is an
        # improvement to the ratings of stale leagues, not a dependency: if a
        # host is down the build carries on with exactly the data it had before,
        # and `sources.json` records that it did.
        continue-on-error: true
        run: python -m model.run --probe

      - name: Build forecast
        # Includes the full walk-forward backtest: warm-starting each fit from
        # the previous round brings it down to about twenty seconds, so there is
        # no reason to skip it on scheduled runs.
        run: python -m model.run

      - name: Show headline numbers
        run: |
          python - <<'PY'
          import json
          fc = json.load(open('site/data/premier-league/forecast.json'))
          print(f"{fc['season']}  {fc['matches_played']}/{fc['matches_total']} played  "
                f"{fc['n_sims']:,} sims")
          for t in fc['teams'][:5]:
              print(f"  {t['name']:24s} {t['pts']:5.1f} pts  title {t['title']*100:5.1f}%")
          try:
              bt = json.load(open('site/data/premier-league/backtest.json'))['model']
              print(f"backtest: log-loss {bt['log_loss']:.4f} over {bt['n']} matches")
          except FileNotFoundError:
              print('backtest: not built')
          PY

      # Tries to turn Pages on by itself. The workflow token is not always
      # allowed to create a Pages site (it cannot on a private repo without a
      # paid plan), so this must not sink an otherwise good build: the forecast
      # is still built and uploaded, and the deploy job is skipped until a human
      # enables Pages once under Settings -> Pages, source "GitHub Actions".
      - name: Persist forecast state
        # Frozen predictions must outlive the build that froze them, and history
        # snapshots must accumulate. Pushes from GITHUB_TOKEN do not retrigger
        # workflows, so this cannot loop.
        #
        # --autostash is load-bearing. The build regenerates every other file
        # under site/data/, and those are never staged, so the working tree is
        # always dirty at this point and a plain `git pull --rebase` refuses
        # with "cannot pull with rebase: You have unstaged changes". That made
        # the retry loop unable to ever succeed: when a scheduled run and a
        # push run overlapped, the second one lost its state commit entirely.
        # Runs even when a league failed upstream: the leagues that did build
        # froze their pre-kickoff predictions and took their daily snapshot,
        # and one broken feed must not throw those away for everyone else.
        if: github.ref == 'refs/heads/main' && !cancelled()
        run: |
          git config user.name "forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          # Per-league paths only. The flat site/data/history.json and
          # predictions.json were duplicates of the Premier League's that no
          # page ever fetched; they were deleted from the repository and the
          # build deletes them again if an old checkout brings them back.
          # Archived matchweek recaps and the weekly global-ranking history
          # accumulate the same way and ride along.
          git add site/data/*/history.json site/data/*/predictions.json \
                  site/data/*/recaps.json site/data/global_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "Persist forecast state (history, predictions, recaps, ranking history)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i); rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          echo "::error::could not persist forecast state after 5 attempts"
          exit 1

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Report Pages status
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages is not enabled for this repository, so the site was" \
               "built but not published. Enable it under Settings -> Pages with source" \
               "'GitHub Actions'. A private repository also needs a paid plan for Pages;" \
               "making the repository public is the other way to get there."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # The github-pages environment only accepts deployments from main; a branch
    # run should build and stop green, not fail at the deploy gate.
    if: needs.build.outputs.pages_ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

