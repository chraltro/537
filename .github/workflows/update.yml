name: Rebuild forecast

on:
  push:
    branches: [claude/premier-league-predictions-rv9405, main]
  workflow_dispatch:
  schedule:
    # Every six hours. The upstream result mirror refreshes daily, so this keeps
    # the site current the morning after a matchday without hammering anything.
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy scipy pytest

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build forecast
        # Includes the full walk-forward backtest: warm-starting each fit from
        # the previous round brings it down to about twenty seconds, so there is
        # no reason to skip it on scheduled runs.
        run: python -m model.run

      - name: Show headline numbers
        run: |
          python - <<'PY'
          import json
          fc = json.load(open('site/data/forecast.json'))
          print(f"{fc['season']}  {fc['matches_played']}/{fc['matches_total']} played  "
                f"{fc['n_sims']:,} sims")
          for t in fc['teams'][:5]:
              print(f"  {t['name']:24s} {t['pts']:5.1f} pts  title {t['title']*100:5.1f}%")
          try:
              bt = json.load(open('site/data/backtest.json'))['model']
              print(f"backtest: log-loss {bt['log_loss']:.4f} over {bt['n']} matches")
          except FileNotFoundError:
              print('backtest: not built')
          PY

      # Tries to turn Pages on by itself. The workflow token is not always
      # allowed to create a Pages site (it cannot on a private repo without a
      # paid plan), so this must not sink an otherwise good build: the forecast
      # is still built and uploaded, and the deploy job is skipped until a human
      # enables Pages once under Settings -> Pages, source "GitHub Actions".
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Report Pages status
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages is not enabled for this repository, so the site was" \
               "built but not published. Enable it under Settings -> Pages with source" \
               "'GitHub Actions'. A private repository also needs a paid plan for Pages;" \
               "making the repository public is the other way to get there."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # The github-pages environment only accepts deployments from main; a branch
    # run should build and stop green, not fail at the deploy gate.
    if: needs.build.outputs.pages_ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

